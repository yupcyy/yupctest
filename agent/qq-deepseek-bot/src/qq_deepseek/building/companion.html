<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼的陪伴记录</title>
<style>body{max-width:760px;margin:40px auto;padding:20px;background:#f0f8fa;color:#234;font:16px system-ui}article{white-space:pre-wrap;padding:20px;margin:12px 0;background:white;border-radius:14px}a{color:#176b80}</style>
<h1>大肥鱼的陪伴记录</h1><a href="/dashboard">返回主页</a><p>主人专属。管理请在 QQ 私聊发送：/画像 内容、/梦境 生成、/日记 生成、/拟人 停止、/拟人 恢复、/拟人 睡觉、/拟人 醒来。</p>
<form id="settings"><p><label><input id="stopped" type="checkbox">停止主动行为</label> <label><input id="asleep" type="checkbox">睡眠状态</label> <label><input id="auto_journal" type="checkbox">自动夜间归档</label></p><p><label>主人画像<br><textarea id="profile" maxlength="500" rows="5" style="width:100%"></textarea></label></p><button>保存设置</button><span id="result"></span></form>
<div id="content">正在读取…</div>
<script>document.getElementById('settings').onsubmit=async event=>{event.preventDefault();const payload={};for(const key of ['stopped','asleep','auto_journal'])payload[key]=document.getElementById(key).checked;payload.profile=document.getElementById('profile').value;try{const response=await fetch('/api/companion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw Error('保存失败（'+response.status+'）');document.getElementById('result').textContent='已保存'}catch(error){document.getElementById('result').textContent=error.message}};fetch('/api/companion').then(response=>response.json()).then(data=>{for(const key of ['stopped','asleep','auto_journal'])document.getElementById(key).checked=!!data.control?.[key];document.getElementById('profile').value=data.profile?.note||''});</script>
<script>
(async()=>{const root=document.getElementById('content');try{const response=await fetch('/api/companion');if(!response.ok)throw Error('读取失败，请确认主人登录及存储配置（'+response.status+'）');const data=await response.json();root.textContent='';function show(value){const node=document.createElement('article');node.textContent=value;root.appendChild(node)}show('拟人功能：'+(data.enabled?'开启':'关闭')+'\n持久化：'+(data.persistence?'开启':'关闭')+'\n状态：'+JSON.stringify(data.control));show('主人画像：'+(data.profile.note||'尚未填写'));for(const [kind,content,created] of data.journal)show(new Date(created*1000).toLocaleString()+' · '+(kind==='dream'?'虚构梦境':'心情日记')+'\n'+content)}catch(error){root.textContent=error.message}})();
</script></html>
